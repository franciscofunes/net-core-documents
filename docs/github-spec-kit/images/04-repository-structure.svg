<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="1600" height="90" fill="#0f172a"/><text x="60" y="58" font-family="Arial" font-size="38" font-weight="700" fill="white">Spec Kit in the Repository — Where the Context Lives</text><rect x="80" y="140" rx="20" width="650" height="670" fill="#111827"/><text x="120" y="185" font-family="monospace" font-size="26" font-weight="700" fill="#f8fafc">financial-angular-app/</text><g font-family="monospace" font-size="22" fill="#d1d5db"><text x="130" y="235">├── .github/</text><text x="170" y="272">│   └── skills/</text><text x="210" y="309">│       ├── speckit-specify/SKILL.md</text><text x="210" y="346">│       ├── speckit-plan/SKILL.md</text><text x="210" y="383">│       ├── speckit-tasks/SKILL.md</text><text x="210" y="420">│       └── ...</text><text x="130" y="467">├── .specify/</text><text x="170" y="504">│   ├── memory/constitution.md</text><text x="170" y="541">│   ├── extensions/</text><text x="170" y="578">│   ├── workflows/</text><text x="170" y="615">│   └── project state / automation</text><text x="130" y="662">├── specs/NNN-export-reporting/</text><text x="170" y="699">│   ├── spec.md</text><text x="170" y="736">│   ├── plan.md</text><text x="170" y="773">│   └── tasks.md + checklists/</text><text x="130" y="810">└── src/app/ ... Angular codebase</text></g><g font-family="Arial"><rect x="820" y="155" rx="18" width="680" height="130" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="860" y="200" font-size="27" font-weight="700" fill="#1d4ed8">.github/skills</text><text x="860" y="240" font-size="21" fill="#334155">Copilot Skills that expose Spec Kit capabilities to the coding agent.</text><rect x="820" y="315" rx="18" width="680" height="150" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="860" y="360" font-size="27" font-weight="700" fill="#c2410c">.specify</text><text x="860" y="400" font-size="21" fill="#334155">Project-level context, constitution, extensions, workflows, scripts,</text><text x="860" y="432" font-size="21" fill="#334155">integration state and agent-context automation.</text><rect x="820" y="495" rx="18" width="680" height="150" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="860" y="540" font-size="27" font-weight="700" fill="#7e22ce">specs/NNN-feature</text><text x="860" y="580" font-size="21" fill="#334155">Persistent feature context: specification, plan, tasks and review</text><text x="860" y="612" font-size="21" fill="#334155">checklists that carry intent across workflow stages.</text><rect x="820" y="675" rx="18" width="680" height="120" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="860" y="720" font-size="27" font-weight="700" fill="#166534">src/app</text><text x="860" y="760" font-size="21" fill="#334155">The existing brownfield Angular application that is actually changed.</text></g><rect x="250" y="835" rx="16" width="1100" height="45" fill="#eff6ff" stroke="#93c5fd"/><text x="800" y="865" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1e3a8a">The repository itself becomes a durable context layer — not just the chat transcript.</text></svg>