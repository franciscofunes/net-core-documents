<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect width="1700" height="900" fill="#f8fafc"/><rect width="1700" height="90" fill="#0f172a"/><text x="60" y="58" font-family="Arial" font-size="38" font-weight="700" fill="white">From Structured SDD to More Agentic Workflows</text><g font-family="Arial"><rect x="80" y="155" rx="20" width="440" height="560" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="300" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Today: Developer-driven SDD</text><text x="120" y="265" font-size="21" fill="#334155">• Human invokes each Spec Kit step</text><text x="120" y="310" font-size="21" fill="#334155">• One coding agent + tools</text><text x="120" y="355" font-size="21" fill="#334155">• Artifacts carry context between stages</text><text x="120" y="400" font-size="21" fill="#334155">• Quality gates before implementation</text><text x="120" y="445" font-size="21" fill="#334155">• Converge creates a feedback loop</text><rect x="145" y="515" rx="16" width="310" height="125" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="300" y="555" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">Core value</text><text x="300" y="590" text-anchor="middle" font-size="19" fill="#334155">Structure + traceability</text><text x="300" y="620" text-anchor="middle" font-size="19" fill="#334155">before more automation</text><rect x="630" y="155" rx="20" width="440" height="560" fill="white" stroke="#7c3aed" stroke-width="3"/><text x="850" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#6d28d9">Spec Kit extensibility</text><rect x="685" y="255" rx="14" width="330" height="80" fill="#f3e8ff"/><text x="850" y="290" text-anchor="middle" font-size="23" font-weight="700" fill="#7e22ce">Extensions</text><text x="850" y="318" text-anchor="middle" font-size="17" fill="#475569">capabilities · integrations · gates · hooks</text><rect x="685" y="365" rx="14" width="330" height="80" fill="#ffedd5"/><text x="850" y="400" text-anchor="middle" font-size="23" font-weight="700" fill="#c2410c">Presets</text><text x="850" y="428" text-anchor="middle" font-size="17" fill="#475569">custom commands · templates · scripts</text><rect x="685" y="475" rx="14" width="330" height="80" fill="#dcfce7"/><text x="850" y="510" text-anchor="middle" font-size="23" font-weight="700" fill="#166534">Workflows</text><text x="850" y="538" text-anchor="middle" font-size="17" fill="#475569">conditions · loops · checkpoints · fan-out</text><rect x="685" y="585" rx="14" width="330" height="80" fill="#e0f2fe"/><text x="850" y="620" text-anchor="middle" font-size="23" font-weight="700" fill="#0369a1">Bundles</text><text x="850" y="648" text-anchor="middle" font-size="17" fill="#475569">package reusable team setups</text><rect x="1180" y="155" rx="20" width="440" height="560" fill="white" stroke="#16a34a" stroke-width="3"/><text x="1400" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#166534">More agentic possibilities</text><text x="1220" y="270" font-size="21" fill="#334155">• Automate multi-step flows</text><text x="1220" y="315" font-size="21" fill="#334155">• Add human approval checkpoints</text><text x="1220" y="360" font-size="21" fill="#334155">• Trigger quality/review hooks</text><text x="1220" y="405" font-size="21" fill="#334155">• Pause / resume workflows</text><text x="1220" y="450" font-size="21" fill="#334155">• Fan-out work where appropriate</text><text x="1220" y="495" font-size="21" fill="#334155">• Potentially coordinate specialized agents</text><rect x="1245" y="550" rx="16" width="310" height="100" fill="#dcfce7" stroke="#16a34a"/><text x="1400" y="590" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">Important</text><text x="1400" y="622" text-anchor="middle" font-size="18" fill="#334155">Multi-agent is possible,</text><text x="1400" y="646" text-anchor="middle" font-size="18" fill="#334155">not required by core SDD.</text></g><line x1="520" y1="435" x2="620" y2="435" stroke="#2563eb" stroke-width="6" marker-end="url(#a)"/><line x1="1070" y1="435" x2="1170" y2="435" stroke="#2563eb" stroke-width="6" marker-end="url(#a)"/><rect x="190" y="775" rx="18" width="1320" height="70" fill="#eff6ff" stroke="#93c5fd"/><text x="850" y="819" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#1e3a8a">Agentic Development = Model + Context + Tools + Workflow + Feedback</text></svg>